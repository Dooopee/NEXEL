<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="187" viewBox="0 0 1200 187" role="img" aria-label="Three pillars of NEXEL: isolated game instances, Modrinth content, and local profiles with skins">
<title>Three pillars of NEXEL</title>
<g font-family="Segoe UI,Arial,sans-serif">
<rect x=".5" y=".5" width="389" height="185" rx="12" fill="#10141c" stroke="#2a303b"/>
<rect x="22" y="23" width="35" height="27" rx="6" fill="#341827"/><text x="39.5" y="42" font-size="11" fill="#ff6f8e" text-anchor="middle" font-weight="700">01</text>
<text x="23" y="88" font-size="23" fill="#f4f4f7" font-weight="700">Build your way</text>
<text x="23" y="123" font-size="14" fill="#aeb6c5">Vanilla, Fabric, Forge, NeoForge.</text>
<text x="23" y="148" font-size="14" fill="#aeb6c5">Separate spaces for every instance.</text>
<rect x="405.5" y=".5" width="389" height="185" rx="12" fill="#10141c" stroke="#2a303b"/>
<rect x="427" y="23" width="35" height="27" rx="6" fill="#341827"/><text x="444.5" y="42" font-size="11" fill="#ff6f8e" text-anchor="middle" font-weight="700">02</text>
<text x="428" y="88" font-size="23" fill="#f4f4f7" font-weight="700">Change the game</text>
<text x="428" y="123" font-size="14" fill="#aeb6c5">Modrinth content and .mrpack imports.</text>
<text x="428" y="148" font-size="14" fill="#aeb6c5">Mods and dependencies together.</text>
<rect x="810.5" y=".5" width="389" height="185" rx="12" fill="#10141c" stroke="#2a303b"/>
<rect x="832" y="23" width="35" height="27" rx="6" fill="#341827"/><text x="849.5" y="42" font-size="11" fill="#ff6f8e" text-anchor="middle" font-weight="700">03</text>
<text x="833" y="88" font-size="23" fill="#f4f4f7" font-weight="700">Own your style</text>
<text x="833" y="123" font-size="14" fill="#aeb6c5">A local skin library and 3D preview.</text>
<text x="833" y="148" font-size="14" fill="#aeb6c5">Your profile. Your play history.</text>
</g>
</svg>
