<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="187" viewBox="0 0 1200 187" role="img" aria-label="Три стороны NEXEL: изолированные сборки, моды из Modrinth и персональный профиль со скинами."><title>Три стороны NEXEL: изолированные сборки, моды из Modrinth и персональный профиль со скинами.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11151d"/><stop offset="1" stop-color="#090b10"/></linearGradient><linearGradient id="rose" x2="1" y2="1"><stop stop-color="#ff9daf"/><stop offset=".5" stop-color="#ff315d"/><stop offset="1" stop-color="#b60e45"/></linearGradient><radialGradient id="glow"><stop stop-color="#ff315d" stop-opacity=".17"/><stop offset="1" stop-color="#ff315d" stop-opacity="0"/></radialGradient><linearGradient id="fade"><stop stop-color="#ff315d" stop-opacity="0"/><stop offset=".5" stop-color="#ff315d"/><stop offset="1" stop-color="#ff315d" stop-opacity="0"/></linearGradient></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0.5" y=".5" width="389" height="185" rx="12" fill="#10141c" stroke="#2a303b"/><rect x="22" y="23" width="35" height="27" rx="6" fill="#341827"/><text x="39.5" y="42" font-size="11" fill="#ff6f8e" text-anchor="middle" font-weight="700">01</text><text x="23" y="88" font-size="23" fill="#f4f4f7" font-weight="700">Собирай по-своему</text><text x="23" y="123" font-size="14" fill="#aeb6c5" >Vanilla, Fabric, Forge, NeoForge.</text><text x="23" y="148" font-size="14" fill="#aeb6c5" >Отдельная среда для каждой сборки.</text><rect x="405.5" y=".5" width="389" height="185" rx="12" fill="#10141c" stroke="#2a303b"/><rect x="427" y="23" width="35" height="27" rx="6" fill="#341827"/><text x="444.5" y="42" font-size="11" fill="#ff6f8e" text-anchor="middle" font-weight="700">02</text><text x="428" y="88" font-size="23" fill="#f4f4f7" font-weight="700">Меняй игру</text><text x="428" y="123" font-size="14" fill="#aeb6c5" >Моды из Modrinth и импорт .mrpack.</text><text x="428" y="148" font-size="14" fill="#aeb6c5" >Контент и зависимости под рукой.</text><rect x="810.5" y=".5" width="389" height="185" rx="12" fill="#10141c" stroke="#2a303b"/><rect x="832" y="23" width="35" height="27" rx="6" fill="#341827"/><text x="849.5" y="42" font-size="11" fill="#ff6f8e" text-anchor="middle" font-weight="700">03</text><text x="833" y="88" font-size="23" fill="#f4f4f7" font-weight="700">Сохраняй свой стиль</text><text x="833" y="123" font-size="14" fill="#aeb6c5" >Библиотека скинов и 3D-превью.</text><text x="833" y="148" font-size="14" fill="#aeb6c5" >Твой профиль. Твоя история игры.</text></g></svg>
